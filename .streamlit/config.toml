[server]
headless = true
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 25
enableWebsocketCompression = true

[browser]
gatherUsageStats = false

[client]
showErrorDetails = false
toolbarMode = "minimal"

[theme]
base = "dark"
primaryColor = "#00f0ff"
backgroundColor = "#02050c"
secondaryBackgroundColor = "#071126"
textColor = "#e2e8f0"
font = "sans serif"